allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
blockExoticSubdeps: true
enablePrePostScripts: false
optimisticRepeatInstall: true
shellEmulator: true
trustPolicy: no-downgrade
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.5.1
trustPolicyIgnoreAfter: 10080
verifyDepsBeforeRun: install
